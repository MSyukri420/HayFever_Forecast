# the leakage tests need dataset/ and skip here
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -c requirements.txt pandas numpy certifi duckdb fastapi httpx pytest
      - name: Test
        run: python -m pytest -v
